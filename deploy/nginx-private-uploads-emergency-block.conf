# nginx-private-uploads-emergency-block.conf
#
# АВАРИЙНА, ВРЕМЕННА защита — точно копие на четирите правила, ръчно
# добавени в активната production конфигурация на pika.bg (server блокът,
# който обслужва сайта и /uploads/). Пълна процедура, проверки и условия за
# премахване: deploy/NGINX_PRIVATE_UPLOADS_EMERGENCY.md
#
# Причина: nginx сервираше тези директории директно от диска, без
# потребителско удостоверяване (потвърдено на production — HTTP 206).
#
# Този файл е само фрагмент за вътрешността на server { ... } блок. НЕ го
# слагай като самостоятелен файл в conf.d/, sites-enabled/ или друга
# директория, която nginx зарежда автоматично на ниво http.
#
# `^~` е задължителен: спира regex проверката за тези префикси, така че
# никой regex location (напр. кеширане по разширение \.(png|webp|...)$) не
# може да "прихване" файл от тези директории преди блокировката.
#
# НЕ премахвай нито едно правило, преди трайното решение с удостоверен
# достъп да е внедрено И проверено на production.

location ^~ /uploads/chat-attachments/ {
    return 403;
}

location ^~ /uploads/support-attachments/ {
    return 403;
}

location ^~ /uploads/topic-mute-evidence-attachments/ {
    return 403;
}

location ^~ /uploads/profile-gallery/ {
    return 403;
}
