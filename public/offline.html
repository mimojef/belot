<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d4a520" />
    <title>Пика — Няма връзка</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
      }
      .icon {
        font-size: 64px;
        line-height: 1;
        opacity: 0.6;
      }
      h1 {
        font-size: 22px;
        font-weight: 900;
        color: #f8fafc;
      }
      p {
        font-size: 15px;
        font-weight: 600;
        color: rgba(255,255,255,0.54);
        max-width: 300px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(180deg,#f4c95b 0%,#c98f13 100%);
        color: #080808;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>Няма връзка с интернет</h1>
    <p>Белот онлайн изисква активна интернет връзка. Провери свързаността и опитай отново.</p>
    <button onclick="reloadLobby()">Опитай отново</button>
    <script>
      ;(function () {
        var RETRY_KEY = '_pika_sw_retried'
        window.reloadLobby = function () {
          setTimeout(function () { location.replace('/lobby?offlineReload=' + Date.now()) }, 300)
        }
        var reloadScheduled = false
        var recoveryCheckInFlight = false
        var recoveryPollTimer = null

        function scheduleReloadLobby() {
          if (reloadScheduled) return
          reloadScheduled = true
          window.reloadLobby()
        }

        function checkRecovery() {
          if (recoveryCheckInFlight || reloadScheduled) return
          recoveryCheckInFlight = true

          fetch('/health', { cache: 'no-store' })
            .then(function (response) {
              if (response.ok) scheduleReloadLobby()
            })
            .catch(function () {})
            .finally(function () {
              recoveryCheckInFlight = false
            })
        }

        function startRecoveryPolling() {
          if (recoveryPollTimer !== null || reloadScheduled) return
          checkRecovery()
          recoveryPollTimer = setInterval(checkRecovery, 1000)
        }

        // Ако браузърът е онлайн, но SW е сервирал offline.html (race condition при update)
        // — опитваме веднъж автоматично. Флагът в sessionStorage предотвратява infinite loop.
        if (navigator.onLine && !sessionStorage.getItem(RETRY_KEY)) {
          sessionStorage.setItem(RETRY_KEY, '1')
          setTimeout(scheduleReloadLobby, 400)
          return
        }
        // При истински offline — изчистваме флага и чакаме връзката да се върне
        sessionStorage.removeItem(RETRY_KEY)
        startRecoveryPolling()
        window.addEventListener('online', startRecoveryPolling)
      })()
    </script>
  </body>
</html>
